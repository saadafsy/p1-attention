# Runs `make verify` per module on a clean runner with pinned tools. VERIFY_NO_LEDGER=1
# and a final `git diff --exit-code` keep the checkout unmodified.
# Not yet observed green on GitHub. UVM is not run (needs Vivado xsim; see tb/uvm/README.md).
name: CI

on:
  push:
  pull_request:

env:
  OSS_CAD_TAG: "2026-09-18"
  OSS_CAD_FILE: "oss-cad-suite-linux-x64-20260918.tgz"
  # Repository variables (Settings > Variables), empty until pinned after the
  # first successful run. Read here because composite actions cannot use vars.
  OSS_CAD_SHA256: ${{ vars.OSS_CAD_SHA256 }}
  VERIBLE_URL: ${{ vars.VERIBLE_URL }}
  VERIBLE_SHA256: ${{ vars.VERIBLE_SHA256 }}
  COCOTB_SPEC: "cocotb>=2.0,<2.1"

jobs:
  toolchain:
    # Fail fast: tool_smoke plus the pure-Python/Perl gates.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - run: make verify MODULE=tool_smoke COVERAGE_STUB=1 VERIFY_NO_LEDGER=1
      - run: make model-check VERIFY_NO_LEDGER=1
      - run: make perl-crosscheck
      - run: make audit-guide
      - name: No tracked file may change
        run: git diff --exit-code

  verify:
    needs: toolchain
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [mac_unit, matmul_tile, online_softmax, attention_top]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Verify ${{ matrix.module }} (seed 1)
        run: make verify MODULE=${{ matrix.module }} SEED=1 VERIFY_NO_LEDGER=1
      - name: Second seed (sim + coverage only)
        run: |
          make sim MODULE=${{ matrix.module }} SEED=7
          make coverage MODULE=${{ matrix.module }}
      - name: PIPE_ROM=1 leg (online_softmax and attention_top)
        if: matrix.module == 'online_softmax' || matrix.module == 'attention_top'
        run: |
          make -C tb/${{ matrix.module }} PIPE_ROM=1 SEED=1 MODULE=
          make coverage MODULE=${{ matrix.module }} PIPE_ROM=1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.module }}
          path: |
            build/
            tb/${{ matrix.module }}/coverage*.dat
            tb/${{ matrix.module }}/func_coverage*.txt
            tb/${{ matrix.module }}/results*.xml
            formal/${{ matrix.module }}*/logfile.txt
          if-no-files-found: ignore
      # Coverage reports are regenerated by every run and print the per-test
      # seed cocotb derives, which differs between cocotb releases; the
      # coverage gate above already fails on any missed bin.
      - name: No tracked file may change (except regenerated coverage reports)
        run: git diff --exit-code -- . ':(exclude)tb/*/func_coverage*.txt'

  fpga-kit-and-vhdl:
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - run: make -C tb/fpga_uart SEED=1 MODULE=
      - run: make -C tb/fpga_tile MODULE=
      - run: python3 fpga/host/attn_host.py --selftest
      - run: make vhdl-crosscheck
      - name: No tracked file may change
        run: git diff --exit-code
