<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#fff"/>
  <rect x="150" y="20" width="750" height="395" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="160" y="36" font-weight="bold">attention_top</text>

  <!-- host load port -->
  <text x="12" y="92" font-family="Courier New, monospace" font-size="11">sel[1:0]</text>
  <text x="12" y="106" font-family="Courier New, monospace" font-size="11">addr[9:0]</text>
  <text x="12" y="120" font-family="Courier New, monospace" font-size="11">wdata[7:0]</text>
  <text x="12" y="134" font-family="Courier New, monospace" font-size="11">we</text>
  <line x1="95" y1="112" x2="168" y2="112" stroke="#000" marker-end="url(#a)"/>
  <text x="12" y="200" font-family="Courier New, monospace" font-size="11">n_len[6:0]</text>
  <text x="12" y="214" font-family="Courier New, monospace" font-size="11">start</text>
  <text x="12" y="228" font-family="Courier New, monospace" font-size="11">busy, done</text>
  <line x1="95" y1="207" x2="168" y2="207" stroke="#000" marker-end="url(#a)"/>
  <text x="12" y="349" font-family="Courier New, monospace" font-size="11">rd_addr[9:0]</text>
  <text x="12" y="399" font-family="Courier New, monospace" font-size="11">rd_data[7:0]</text>

  <!-- memories -->
  <rect x="170" y="62" width="110" height="34" fill="#fff" stroke="#000"/>
  <text x="225" y="78" text-anchor="middle">Q RAM</text>
  <text x="225" y="91" text-anchor="middle" font-size="10">256 x 32</text>
  <rect x="170" y="104" width="110" height="34" fill="#fff" stroke="#000"/>
  <text x="225" y="120" text-anchor="middle">K RAM</text>
  <text x="225" y="133" text-anchor="middle" font-size="10">256 x 32</text>
  <rect x="170" y="146" width="110" height="34" fill="#fff" stroke="#000"/>
  <text x="225" y="162" text-anchor="middle">V RAM</text>
  <text x="225" y="175" text-anchor="middle" font-size="10">64 x 128</text>

  <!-- control -->
  <rect x="170" y="194" width="110" height="40" fill="#fff" stroke="#000"/>
  <text x="225" y="211" text-anchor="middle">control FSM</text>
  <text x="225" y="225" text-anchor="middle" font-size="10">rg, kb, t counters</text>

  <!-- matmul tile -->
  <rect x="330" y="62" width="130" height="76" fill="#fff" stroke="#000"/>
  <text x="395" y="84" text-anchor="middle">matmul_tile</text>
  <text x="395" y="100" text-anchor="middle" font-size="10">4 x 4 mac_unit</text>
  <text x="395" y="114" text-anchor="middle" font-size="10">s8 x s8, 24-bit acc</text>
  <line x1="280" y1="79" x2="328" y2="88" stroke="#000" marker-end="url(#a)"/>
  <line x1="280" y1="121" x2="328" y2="112" stroke="#000" marker-end="url(#a)"/>
  <text x="290" y="72" font-size="10">32</text>
  <text x="290" y="135" font-size="10">32</text>

  <!-- drain buf + score conversion -->
  <rect x="500" y="62" width="120" height="34" fill="#fff" stroke="#000"/>
  <text x="560" y="78" text-anchor="middle">drain_buf</text>
  <text x="560" y="91" text-anchor="middle" font-size="10">16 x 24</text>
  <line x1="460" y1="79" x2="498" y2="79" stroke="#000" marker-end="url(#a)"/>
  <text x="464" y="74" font-size="10">384</text>
  <rect x="500" y="104" width="120" height="34" fill="#fff" stroke="#000"/>
  <text x="560" y="120" text-anchor="middle">score conversion</text>
  <text x="560" y="133" text-anchor="middle" font-size="10" font-family="Courier New, monospace">sat16((s+8)&gt;&gt;&gt;4)</text>
  <line x1="560" y1="96" x2="560" y2="102" stroke="#000" marker-end="url(#a)"/>

  <!-- softmax lanes -->
  <rect x="660" y="62" width="140" height="76" fill="#fff" stroke="#000"/>
  <rect x="664" y="66" width="140" height="76" fill="none" stroke="#000"/>
  <rect x="668" y="70" width="140" height="76" fill="#fff" stroke="#000"/>
  <text x="738" y="94" text-anchor="middle">online_softmax x 4</text>
  <text x="738" y="110" text-anchor="middle" font-size="10">running max m, sum l</text>
  <text x="738" y="124" text-anchor="middle" font-size="10">exp ROM, 1 lookup</text>
  <line x1="620" y1="121" x2="666" y2="108" stroke="#000" marker-end="url(#a)"/>
  <text x="630" y="108" font-size="10">16</text>

  <!-- PV datapath -->
  <rect x="330" y="230" width="470" height="60" fill="#fff" stroke="#000"/>
  <text x="565" y="252" text-anchor="middle">PV datapath, 16 columns x 4 rows</text>
  <text x="565" y="270" text-anchor="middle" font-size="10" font-family="Courier New, monospace">acc = rshr(acc * r, 15) + w * v</text>
  <text x="565" y="283" text-anchor="middle" font-size="10">acc_num Q10.21, 32 bit</text>
  <line x1="738" y1="146" x2="738" y2="228" stroke="#000" marker-end="url(#a)"/>
  <text x="744" y="190" font-size="10">w, r (16), l (24)</text>
  <polyline points="280,163 305,163 305,260 328,260" fill="none" stroke="#000" marker-end="url(#a)"/>
  <text x="309" y="200" font-size="10">128</text>

  <!-- dividers + out ram -->
  <rect x="570" y="330" width="230" height="40" fill="#fff" stroke="#000"/>
  <text x="685" y="347" text-anchor="middle">divider bank, 16 restoring</text>
  <text x="685" y="361" text-anchor="middle" font-size="10" font-family="Courier New, monospace">sat8(round(acc / l))</text>
  <line x1="685" y1="290" x2="685" y2="328" stroke="#000" marker-end="url(#a)"/>
  <rect x="330" y="330" width="130" height="40" fill="#fff" stroke="#000"/>
  <text x="395" y="347" text-anchor="middle">out RAM</text>
  <text x="395" y="361" text-anchor="middle" font-size="10">64 x 128</text>
  <line x1="570" y1="350" x2="462" y2="350" stroke="#000" marker-end="url(#a)"/>
  <line x1="102" y1="345" x2="328" y2="345" stroke="#000" marker-end="url(#a)"/>
  <polyline points="395,370 395,395 104,395" fill="none" stroke="#000" marker-end="url(#a)"/>
</svg>
